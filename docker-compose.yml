# استقرار production-like: web (gunicorn) + worker + beat + Postgres + Redis + frontend.
# همه‌ی سرویس‌های اپ از یک image واحد ساخته می‌شوند و فقط نقش (command) فرق دارد،
# تا مقیاس‌دهی افقی هر بخش مستقل ممکن باشد: docker compose up --scale worker=4

x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-${SECRET_KEY}}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-${DEBUG:-False}}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${ALLOWED_HOSTS:-*}}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-${CSRF_TRUSTED_ORIGINS:-https://space.mydesko.ir,http://space.mydesko.ir}}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://space.mydesko.ir,http://space.mydesko.ir,http://185.252.86.221}
  POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-desko}}
  POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-desko}}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://${POSTGRES_USER:-${DB_USER:-desko}}:${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}@db:5432/${POSTGRES_DB:-${DB_NAME:-desko}}
  REDIS_URL: redis://redis:6379/0
  AI_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  AI_GENERATION_MODE: ${AI_GENERATION_MODE:-celery}
  AI_STREAM_TRANSPORT: ${AI_STREAM_TRANSPORT:-redis}
  AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
  AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-}
  AI_DEFAULT_MODEL_KEY: ${AI_DEFAULT_MODEL_KEY:-gpt-4o-mini}
  SKYROOM_API_KEY: ${SKYROOM_API_KEY:-}
  SKYROOM_LOGIN_URL_TTL: ${SKYROOM_LOGIN_URL_TTL:-3600}
  ATHENA_BASE_URL: ${ATHENA_BASE_URL:-http://athena:8001}
  ATHENA_JWT_ISSUER: ${ATHENA_JWT_ISSUER:-desko}
  ATHENA_JWT_AUDIENCE: ${ATHENA_JWT_AUDIENCE:-athena}
  ATHENA_JWT_PRIVATE_KEY_FILE: /keys/athena-private.pem
  MEDIA_ROOT: /app/media

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-desko}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-desko}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-athena.sh:/docker-entrypoint-initdb.d/init-athena.sh:ro
    healthcheck:
      # $$ → env داخل کانتینر (نه interpolate روی هاست)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - desko_network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - desko_network

  web:
    build: .
    command: ["web"]
    environment:
      <<: *app-env
    volumes:
      - static_volume:/app/staticfiles
      - ./docker/jwt:/keys:ro
      - exam_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      athena:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - desko_network

  worker:
    build: .
    command: ["worker"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - desko_network

  beat:
    build: .
    command: ["beat"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - desko_network

  athena:
    build:
      context: ./athena-engine-main
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["uv", "run", "--no-dev", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-desko}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}
      POSTGRES_DB: athena
      POSTGRES_ADMIN_DB: postgres
      JWT_ISSUER: ${ATHENA_JWT_ISSUER:-desko}
      JWT_AUDIENCE: ${ATHENA_JWT_AUDIENCE:-athena}
      JWT_ALGORITHM: RS256
      JWT_PUBLIC_KEY_FILE: /keys/athena-public.pem
      CORS_ALLOW_ORIGINS: '["*"]'
    volumes:
      - ./docker/jwt:/keys:ro
      - ./athena-engine-main/docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./athena-engine-main/docker/ensure_db.py:/app/docker/ensure_db.py:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped
    networks:
      - desko_network

  athena-session-status:
    build:
      context: ./athena-engine-main
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["uv", "run", "--no-dev", "python", "-m", "src.worker", "exam_session_status"]
    environment:
      ATHENA_MIGRATE: "0"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-desko}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}
      POSTGRES_DB: athena
      POSTGRES_ADMIN_DB: postgres
      JWT_ISSUER: ${ATHENA_JWT_ISSUER:-desko}
      JWT_AUDIENCE: ${ATHENA_JWT_AUDIENCE:-athena}
      JWT_PUBLIC_KEY_FILE: /keys/athena-public.pem
    volumes:
      - ./docker/jwt:/keys:ro
      - ./athena-engine-main/docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./athena-engine-main/docker/ensure_db.py:/app/docker/ensure_db.py:ro
    depends_on:
      athena:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - desko_network

  athena-attempt-status:
    build:
      context: ./athena-engine-main
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["uv", "run", "--no-dev", "python", "-m", "src.worker", "session_attempt_status"]
    environment:
      ATHENA_MIGRATE: "0"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-desko}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}
      POSTGRES_DB: athena
      POSTGRES_ADMIN_DB: postgres
      JWT_ISSUER: ${ATHENA_JWT_ISSUER:-desko}
      JWT_AUDIENCE: ${ATHENA_JWT_AUDIENCE:-athena}
      JWT_PUBLIC_KEY_FILE: /keys/athena-public.pem
    volumes:
      - ./docker/jwt:/keys:ro
      - ./athena-engine-main/docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./athena-engine-main/docker/ensure_db.py:/app/docker/ensure_db.py:ro
    depends_on:
      athena:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - desko_network

  athena-grading:
    build:
      context: ./athena-engine-main
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: ["uv", "run", "--no-dev", "python", "-m", "src.worker", "session_attempt_grading"]
    environment:
      ATHENA_MIGRATE: "0"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-desko}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-desko}}
      POSTGRES_DB: athena
      POSTGRES_ADMIN_DB: postgres
      JWT_ISSUER: ${ATHENA_JWT_ISSUER:-desko}
      JWT_AUDIENCE: ${ATHENA_JWT_AUDIENCE:-athena}
      JWT_PUBLIC_KEY_FILE: /keys/athena-public.pem
    volumes:
      - ./docker/jwt:/keys:ro
      - ./athena-engine-main/docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./athena-engine-main/docker/ensure_db.py:/app/docker/ensure_db.py:ro
    depends_on:
      athena:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - desko_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - desko_network

networks:
  desko_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  static_volume:
  exam_media:
