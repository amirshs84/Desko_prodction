log_format debug_format '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'Host="$host" '
                        'X-Forwarded-Proto="$http_x_forwarded_proto" '
                        'X-Real-IP="$http_x_real_ip"';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log debug_format;
    error_log /var/log/nginx/error.log debug;

    # APK اندروید: فایل Desko.apk را در همین مسیر کنار index.html بگذارید
    # مثال: /usr/share/nginx/html/Desko.apk
    location = /Desko.apk {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Desko.apk"';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Add correct MIME type for .mjs files globally for this server block
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /admin/ {
        proxy_pass http://web:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}
