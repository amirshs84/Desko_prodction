log_format debug_format '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'Host="$host" '
                        'X-Forwarded-Proto="$http_x_forwarded_proto" '
                        'X-Real-IP="$http_x_real_ip"';

server {
    listen 80;
    server_name space.mydesko.ir www.space.mydesko.ir localhost 185.252.86.221;

    client_max_body_size 80m;

    access_log /var/log/nginx/access.log debug_format;
    error_log /var/log/nginx/error.log debug;

    # APK اندروید: فایل Desko.apk را در همین مسیر کنار index.html بگذارید
    # مثال: /usr/share/nginx/html/Desko.apk
    location = /Desko.apk {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Desko.apk"';
    }

    location /pdfium/ {
        root /usr/share/nginx/html;
        include /etc/nginx/mime.types;
        types {
            application/wasm wasm;
            font/ttf ttf;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Add correct MIME type for .mjs files globally for this server block
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
    }

    # resolver داخلی Docker — بعد از recreate شدن web، IP جدید گرفته شود
    resolver 127.0.0.11 valid=10s ipv6=off;

    # دفترچه آزمون: Django فقط دسترسی را چک می‌کند؛ فایل را nginx می‌دهد
    # تا gunicorn پشت دانلود ۳ مگ قفل نشود.
    location /internal-exam-media/ {
        internal;
        alias /exam_media/;
        add_header Cache-Control "private, max-age=120";
    }

    location /api/ {
        # با متغیر، اگر URI در proxy_pass باشد مسیر درخواست به /api/ کوتاه می‌شود → 404.
        # بدون URI، nginx کل مسیر کلاینت (/api/sessions/ ...) را عبور می‌دهد.
        set $backend_web web;
        proxy_pass http://$backend_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        client_max_body_size 80m;
    }

    location /ws/ {
        set $backend_asgi asgi;
        proxy_pass http://$backend_asgi:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
    }

    location /admin/ {
        set $backend_web web;
        proxy_pass http://$backend_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}
