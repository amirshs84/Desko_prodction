// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
        maven { url = uri("${rootDir}/local-maven") }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"
apply from: "disable-lint-tasks.gradle"
apply from: "offline-annotations.gradle"

allprojects {
    repositories {
        // اول local-maven تا وابستگی‌های دستی قبل از اینترنت خوانده شوند
        maven { url = uri("${rootDir}/local-maven") }
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'androidx.activity:activity-ktx:1.11.0'
            force 'androidx.activity:activity:1.11.0'
            force 'androidx.core:core:1.17.0'
            force 'androidx.core:core-ktx:1.17.0'
            force 'androidx.lifecycle:lifecycle-livedata:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
            force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
            force 'androidx.emoji2:emoji2:1.3.0'
            force 'androidx.emoji2:emoji2-views-helper:1.3.0'
            force 'androidx.arch.core:core-runtime:2.2.0'
            force 'androidx.arch.core:core-common:2.2.0'
            force 'androidx.fragment:fragment:1.8.9'
            force 'androidx.appcompat:appcompat:1.7.1'
            eachDependency { details ->
                if (details.requested.group == 'androidx.fragment'
                        && details.requested.name == 'fragment') {
                    details.useVersion '1.8.9'
                }
                if (details.requested.group == 'androidx.lifecycle'
                        && details.requested.version.startsWith('2.')
                        && details.requested.version != '2.6.2') {
                    details.useVersion '2.6.2'
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
