<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دستیار هوش مصنوعی دِسکو</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
      --accent: #6366f1; --accent2: #818cf8; --text: #e2e8f0;
      --muted: #94a3b8; --user: #4338ca; --ai: #334155; --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
      background: linear-gradient(160deg, #0f172a, #111827); color: var(--text);
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .app {
      width: min(760px, 96vw); height: min(92vh, 900px);
      background: var(--panel); border-radius: 18px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      border: 1px solid #334155;
    }
    header {
      padding: 16px 20px; background: var(--panel2); border-bottom: 1px solid #334155;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    header h1 { font-size: 17px; margin: 0; }
    header .model { font-size: 12px; color: var(--muted); }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #0b3b2e; color: #4ade80; }
    .badge.off { background: #3b0b0b; color: #f87171; }

    /* Auth */
    .auth { padding: 28px; display: flex; flex-direction: column; gap: 12px; margin: auto; width: min(360px, 90%); }
    .auth h2 { margin: 0 0 6px; font-size: 20px; text-align: center; }
    .auth p { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 10px; }
    input, textarea, button, select {
      font-family: inherit; font-size: 14px; border-radius: 10px; border: 1px solid #3b4a63;
      background: #0f172a; color: var(--text); padding: 11px 13px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent2); }
    button {
      background: var(--accent); border: none; color: #fff; cursor: pointer; font-weight: 600;
      transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; }
    .tabs button { flex: 1; background: #0f172a; color: var(--muted); border: 1px solid #3b4a63; }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .error { color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; }

    /* Chat */
    .chat { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 82%; padding: 11px 15px; border-radius: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-start; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-end; background: var(--ai); border-bottom-left-radius: 4px; }
    .msg.pending { color: var(--muted); font-style: italic; }
    .msg .role { display: block; font-size: 11px; opacity: .7; margin-bottom: 4px; }
    .composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #334155; background: var(--panel2); }
    .composer textarea { flex: 1; resize: none; max-height: 120px; }
    .composer button { padding: 0 22px; }
    .empty { margin: auto; color: var(--muted); text-align: center; font-size: 14px; }
    .topbtn { background: transparent; border: 1px solid #3b4a63; color: var(--muted); padding: 6px 12px; font-size: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>دستیار هوش مصنوعی دِسکو</h1>
        <div class="model">مدل: {{ model_name|default:"تعریف‌نشده" }}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        {% if model_id %}<span class="badge">مدل آماده</span>{% else %}<span class="badge off">مدلی ثبت نشده</span>{% endif %}
        <button class="topbtn" id="logoutBtn" style="display:none;">خروج</button>
      </div>
    </header>

    <!-- ورود / ثبت‌نام -->
    <div class="auth" id="authView">
      <h2>ورود به حساب</h2>
      <p>برای شروع گفت‌وگو وارد شوید یا حساب بسازید.</p>
      <div class="tabs">
        <button id="tabLogin" class="active" type="button">ورود</button>
        <button id="tabRegister" type="button">ثبت‌نام</button>
      </div>
      <input id="phone" placeholder="شماره تلفن (مثلاً 09120000000)" autocomplete="username" />
      <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" />
      <input id="passwordConfirm" type="password" placeholder="تکرار رمز عبور" style="display:none;" />
      <button id="authBtn" type="button">ورود</button>
      <div class="error" id="authError"></div>
      <p style="font-size:11px;">راهنمای رمز: حداقل ۸ کاراکتر، شامل حرف بزرگ و کوچک، عدد و علامت.</p>
    </div>

    <!-- چت -->
    <div class="chat" id="chatView">
      <div class="messages" id="messages">
        <div class="empty" id="emptyState">پیام خود را بنویسید تا گفت‌وگو شروع شود.</div>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
        <button id="sendBtn" type="button">ارسال</button>
      </div>
    </div>
  </div>

  <script>
    const MODEL_ID = "{{ model_id }}";
    const API = "/api";
    let token = localStorage.getItem("desko_token") || "";
    let conversationId = null;
    let mode = "login";

    const $ = (id) => document.getElementById(id);
    const authView = $("authView"), chatView = $("chatView");

    function authHeaders(json = true) {
      const h = {};
      if (json) h["Content-Type"] = "application/json";
      if (token) h["Authorization"] = "Bearer " + token;
      return h;
    }

    function showChat() {
      authView.style.display = "none";
      chatView.style.display = "flex";
      $("logoutBtn").style.display = "inline-block";
    }
    function showAuth() {
      authView.style.display = "flex";
      chatView.style.display = "none";
      $("logoutBtn").style.display = "none";
    }

    // --- سوییچ تب ورود/ثبت‌نام ---
    $("tabLogin").onclick = () => setMode("login");
    $("tabRegister").onclick = () => setMode("register");
    function setMode(m) {
      mode = m;
      $("tabLogin").classList.toggle("active", m === "login");
      $("tabRegister").classList.toggle("active", m === "register");
      $("passwordConfirm").style.display = m === "register" ? "block" : "none";
      $("authBtn").textContent = m === "register" ? "ثبت‌نام" : "ورود";
      $("authError").textContent = "";
    }

    // --- ورود / ثبت‌نام ---
    $("authBtn").onclick = async () => {
      const phone = $("phone").value.trim();
      const password = $("password").value;
      $("authError").textContent = "";
      if (!phone || !password) { $("authError").textContent = "شماره و رمز الزامی است."; return; }
      $("authBtn").disabled = true;
      try {
        let url, body;
        if (mode === "register") {
          url = API + "/auth/register/";
          body = { phone_number: phone, password, password_confirm: $("passwordConfirm").value };
        } else {
          url = API + "/auth/login/";
          body = { phone_number: phone, password };
        }
        const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok || !data.access) {
          $("authError").textContent = data.error || "خطا در ورود.";
          return;
        }
        token = data.access;
        localStorage.setItem("desko_token", token);
        await startConversation();
      } catch (e) {
        $("authError").textContent = "خطای شبکه: " + e.message;
      } finally {
        $("authBtn").disabled = false;
      }
    };

    $("logoutBtn").onclick = () => {
      token = ""; conversationId = null;
      localStorage.removeItem("desko_token");
      $("messages").innerHTML = '<div class="empty">پیام خود را بنویسید تا گفت‌وگو شروع شود.</div>';
      showAuth();
    };

    // --- ساخت مکالمه ---
    async function startConversation() {
      if (!MODEL_ID) { alert("هیچ مدلی در دیتابیس ثبت نشده. دستور seed_ai_model را اجرا کنید."); showAuth(); return; }
      const res = await fetch(API + "/ai/conversations/", {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ model_id: MODEL_ID, title: "گفت‌وگوی آزمایشی" }),
      });
      if (res.status === 401) { $("logoutBtn").onclick(); return; }
      const data = await res.json();
      if (!res.ok) { alert("خطا در ساخت مکالمه: " + JSON.stringify(data)); return; }
      conversationId = data.id;
      showChat();
    }

    // --- ارسال پیام ---
    const input = $("input");
    input.addEventListener("input", () => {
      input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sendBtn").click(); }
    });

    $("sendBtn").onclick = async () => {
      const content = input.value.trim();
      if (!content || !conversationId) return;
      input.value = ""; input.style.height = "auto";
      const empty = $("emptyState"); if (empty) empty.remove();

      addMessage("user", content);
      const pending = addMessage("assistant", "در حال نوشتن پاسخ...", true);
      $("sendBtn").disabled = true;
      try {
        // در حالت inline، این درخواست تا پایان تولید پاسخ بلاک می‌شود.
        const res = await fetch(API + "/ai/conversations/" + conversationId + "/messages/send/", {
          method: "POST", headers: authHeaders(),
          body: JSON.stringify({ content }),
        });
        const data = await res.json();
        if (!res.ok) {
          pending.classList.remove("pending");
          pending.querySelector(".body").textContent = "خطا: " + (data.error?.message || JSON.stringify(data));
          return;
        }
        // پاسخ کامل را از دیتابیس می‌خوانیم (send فقط placeholder برمی‌گرداند).
        await refreshLastAnswer(pending);
      } catch (e) {
        pending.classList.remove("pending");
        pending.querySelector(".body").textContent = "خطای شبکه: " + e.message;
      } finally {
        $("sendBtn").disabled = false;
      }
    };

    async function refreshLastAnswer(pendingEl) {
      const res = await fetch(API + "/ai/conversations/" + conversationId + "/messages/?limit=100", { headers: authHeaders(false) });
      const data = await res.json();
      const items = (data.items || []).slice().sort((a, b) => a.seq - b.seq);
      const lastAssistant = [...items].reverse().find((m) => m.role === "assistant");
      pendingEl.classList.remove("pending");
      const body = pendingEl.querySelector(".body");
      if (lastAssistant && lastAssistant.content) {
        body.textContent = lastAssistant.content;
      } else if (lastAssistant && lastAssistant.status === "failed") {
        body.textContent = "تولید پاسخ ناموفق بود.";
      } else {
        body.textContent = "(پاسخی دریافت نشد)";
      }
    }

    function addMessage(role, text, pending = false) {
      const el = document.createElement("div");
      el.className = "msg " + role + (pending ? " pending" : "");
      const label = document.createElement("span");
      label.className = "role";
      label.textContent = role === "user" ? "شما" : "دستیار";
      const body = document.createElement("span");
      body.className = "body";
      body.textContent = text;
      el.appendChild(label); el.appendChild(body);
      $("messages").appendChild(el);
      $("messages").scrollTop = $("messages").scrollHeight;
      return el;
    }

    // اگر توکن ذخیره شده داریم، مستقیم وارد چت شویم.
    if (token) { startConversation(); } else { showAuth(); }
  </script>
</body>
</html>
